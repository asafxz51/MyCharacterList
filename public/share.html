<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" href="/icon.png">

    <title>Shared List - MyCharacterList</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-y: auto;
            display: block !important;
            background-color: var(--bg-color);
        }

        .navbar {
            min-height: 60px;
            height: auto;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(187, 134, 252, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(187, 134, 252, 0.2);
        }

        .user-chip i {
            font-size: 1.1rem;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-controls button {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-main);
            height: 38px;
            padding: 0 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #authBtnNav {
            background: var(--accent);
            color: white !important;
            border: none;
            font-weight: bold;
            padding: 0 15px;
        }

        #notifArea {
    position: relative !important;
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
}

#notifBadge {
    position: absolute;
    top: -2px;      /* שינוי מיקום מלמעלה */
    right: -2px;     /* שינוי מיקום מימין */
    background: #ff4444;
    color: white;
    border-radius: 50%;
    min-width: 24px; /* מבטיח עיגול מושלם */
    height: 24px;
    padding: 0 4px;
    font-size: 0.7rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--sidebar-bg); /* מסגרת דקה שיוצרת הפרדה מהכפתור */
    z-index: 10;
    pointer-events: none; /* מבטיח שהלחיצה תעבור לכפתור שמתחת */
}

.mobile-only-btn {
    display: none; /* כבוי בדסקטופ */
}

        @media (max-width: 768px) {
            .navbar {
                padding: 10px;
                justify-content: space-between;
            }

            .logo {
                font-size: 1.1rem;
            }

            .nav-controls {
                width: 100%;
                justify-content: space-between;
                margin-top: 5px;
                padding-top: 10px;
                border-top: 1px solid var(--border);
            }

            #authBtnNav {
                flex: 1.5;
            }

             .nav-controls button, #notifArea {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #notifBtn {
        width: 100%; /* שהכפתור ימלא את המיכל */
    }

    #notifBadge {
        top: 2px;   /* התאמה למובייל */
        right: 15%; /* הצמדה לפינת האייקון במובייל */
    }

               #otherListsContainer {
            display: flex;
            flex-direction: column;
        }
        }

         .nav-identity {
        display: none !important;
    }

    .mobile-only-btn:not(.hidden) {
        display: flex !important;
    }


        .share-wrapper {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px 80px 20px;
        }

        .share-header {
            text-align: center;
            margin: 0 auto 40px auto;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }


        .unified-filter {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 54px;
            overflow: hidden;
            width: 100%;
            max-width: 480px;
            align-items: center;
            margin: 0 auto 30px auto;
        }

        .unified-filter input {
            flex: 1;
            height: 100%;
            border: none !important;
            background: transparent !important;
            padding: 0 15px;
            color: var(--text-main);
            outline: none;
            font-size: 16px;
        }

        .unified-filter select {
            width: 130px;
            height: 100%;
            border: none !important;
            border-left: 1px solid var(--border) !important;
            background: var(--card-bg);
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            padding: 0 10px;
            appearance: none;
        }

        #commentsSection {
            max-width: 900px;
            margin: 80px auto 50px auto !important;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .hidden {
    display: none !important;
}

        /* כפתור הפרופיל במובייל - מוסתר כברירת מחדל */

    </style>
</head>

<body class="dark-theme">
    <nav class="navbar">
        <a href="/" style="text-decoration: none;">
            <div class="logo">MyCharacterList</div>
        </a>
        <div class="nav-identity" onclick="openProfileModal()" style="cursor: pointer;" title="Edit Avatar">
            <span id="userDisplay" class="user-chip hidden">
                <img id="navAvatar" src="" class="hidden"
                    style="width: 26px; height: 26px; border-radius: 50%; object-fit: cover; margin-right: 5px; border: 1px solid var(--accent);">
                <i id="navDefaultIcon" class="fas fa-user-circle"></i>
                <span id="usernameLabel"></span>
            </span>
        </div>
        <div class="nav-controls">
            <button id="authBtnNav">Login</button>
            <button id="adminBtn" class="icon-btn hidden" title="Admin Panel"><i class="fas fa-crown"
                    style="color: gold;"></i></button>
                    <button id="mobileProfileBtn" class="mobile-only-btn hidden" onclick="openProfileModal()" title="Profile">
                        <i class="fas fa-user"></i>
                    </button>
            <button id="communityBtn" title="View Users"><i class="fas fa-users"></i></button>
            <div id="notifArea" class="hidden" style="position: relative; display: inline-block;">
                <button id="notifBtn" title="Notifications"><i class="fas fa-bell"></i></button>
                <span id="notifBadge" class="hidden"
                    style="position: absolute; top: -5px; right: -5px; background: #ff4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; font-weight: bold;">0</span>
                <div id="notifDropdown" class="hidden"
                    style="position: absolute; top: 40px; right: 0; width: 280px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; z-index: 3000; max-height: 400px; overflow-y: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.4);">
                </div>
            </div>
            <button id="themeToggle"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <div class="share-wrapper">
        <div class="share-header">
            <h1 id="listTitle" style="font-size: 2.5rem; margin-bottom: 10px;">Loading...</h1>
            <p id="listAuthor" style="color:var(--text-muted); font-size: 1.1rem; margin-bottom: 15px;"></p>
            <div id="otherListsContainer"
                style="display: none; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
                <label style="color: var(--text-muted); font-size: 0.9rem;">More from this user:</label>
                <select id="userListsDropdown"
                    style="width: auto; min-width: 200px; padding: 8px; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px; cursor: pointer;"></select>
            </div>
        </div>

        <div id="listInteractions" style="display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;">
            <button id="likeBtn" class="btn-primary"
                style="width: auto; background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px 25px;">
                <i class="far fa-heart"></i> <span id="likesCount">0</span> Likes
            </button>
        </div>

        <div class="controls">
            <div class="unified-filter">
                <input type="text" id="listFilterInput" placeholder="🔍 Search in list...">
                <select id="filterSelect">
                    <option value="all">All Categories</option>
                    <option value="Anime">Anime</option>
                    <option value="Game">Game</option>
                    <option value="VN">Visual Novel</option>
                    <option value="TV Show">TV Shows</option>
                    <option value="Movie">Movies</option>
                    <option value="Manga">Manga</option>
                    <option value="Book">Books</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div id="grid" class="grid"></div>

    <div id="commentsSection" style="display: none;">
        <h3 style="margin-bottom: 20px; color: var(--accent);"><i class="fas fa-comments"></i> Comments</h3>
    
        <!-- תיבת כתיבה למחוברים -->
        <div id="commentInputArea" style="margin-bottom: 30px; display: none; gap: 10px;">
            <input type="text" id="commentText" placeholder="Write a comment..."
                style="flex: 1; height: 50px; padding: 0 15px; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); border-radius: 10px;">
            <button id="submitComment" class="btn-primary" style="width: auto; padding: 0 25px;">Post</button>
        </div>
    
        <!-- הודעה למנותקים -->
        <div id="loginToCommentNotice"
            style="display: none; text-align: center; padding: 20px; background: rgba(187, 134, 252, 0.05); border-radius: 10px; margin-bottom: 30px; border: 1px dashed var(--accent);">
            <p style="color: var(--text-muted); font-size: 1rem;">
                <i class="fas fa-lock" style="margin-right: 10px;"></i>
                Please <span style="color: var(--accent); font-weight: bold; cursor: pointer; text-decoration: underline;"
                    onclick="document.getElementById('authModal').classList.remove('hidden')">Log In</span> to post a
                comment.
            </p>
        </div>
    
        <div id="commentsList"></div>
        <div id="loadMoreCommentsContainer" style="text-align: center; margin-top: 20px; display: none;">
            <button id="loadMoreCommentsBtn" class="btn-primary"
                style="width: auto; background: transparent; border: 1px solid var(--accent); color: var(--accent);">Load
                More</button>
        </div>
    </div>

    <!-- Modals -->
    <div id="communityModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="closeCommModal">&times;</span>
            <h3 id="communityTitle" style="text-align: center; margin-bottom: 15px;">Community</h3>
            <button id="commBackBtn" class="btn-primary hidden"
                style="margin-bottom:15px; width:auto; background:#555;"><i class="fas fa-arrow-left"></i> Back</button>
            <div id="commControls">
                <input type="text" id="userSearchInput" placeholder="Search for users..."
                    style="width:100%; margin-bottom:15px; padding:10px; border-radius:6px; background:var(--bg-color); border:1px solid var(--border); color:var(--text-main);">
            </div>
            <div id="communityGrid" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));">
            </div>
        </div>
    </div>

    <div id="authModal" class="modal hidden">
        <div class="modal-content small-modal">
            <span class="close-modal" id="closeAuth">&times;</span>
            <h3 id="authTitle">Login</h3>
            <input type="text" id="authUsername" placeholder="Username"
                style="width:100%; margin:15px 0 10px 0; padding:10px; background:var(--bg-color); color:white; border:1px solid var(--border);">
            <div style="position: relative; width: 100%; margin-bottom: 15px;">
                <input type="password" id="authPassword" placeholder="Password"
                    style="width: 100%; padding: 10px; padding-right: 40px; background: var(--bg-color); color: white; border: 1px solid var(--border); border-radius: 4px;">
                <i class="fas fa-eye" id="togglePassword"
                    style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; font-size: 0.9rem;"></i>
            </div>
            <button id="authSubmitBtn" class="btn-primary">Login</button>
            <p id="authSwitch" style="margin-top:15px; cursor:pointer; color:#888;">Need an account? Register.</p>
        </div>
    </div>

    <div id="profileModal" class="modal hidden">
        <div class="modal-content small-modal">
            <span class="close-modal" id="closeProfileModal">&times;</span>
            <h3 style="margin-bottom: 20px;">Change Profile Picture</h3>
            <div style="text-align: center; margin-bottom: 20px;">
                <img id="profilePreviewImg" src=""
                    style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent); padding: 3px; background: var(--bg-color);">
            </div>
            <div class="form-group" style="text-align: left;">
                <label style="font-size: 0.85rem; color: var(--text-muted);">Paste Image URL:</label>
                <input type="text" id="avatarUrlInput" placeholder="https://..."
                    style="width: 100%; padding: 8px; background: var(--bg-color); border: 1px solid var(--border); color: white;">
            </div>
            <div style="margin: 15px 0; display: flex; align-items: center; gap: 10px;">
                <hr style="flex: 1; border: 0; border-top: 1px solid var(--border);">
                <span style="font-size: 0.8rem; color: #888;">OR</span>
                <hr style="flex: 1; border: 0; border-top: 1px solid var(--border);">
            </div>
            <div class="form-group">
                <label for="avatarFileInput" class="btn-primary"
                    style="background: transparent; border: 1px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; height: 45px; width: 100%;">
                    <i class="fas fa-upload"></i> Upload from Device
                </label>
                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;">
            </div>
            <button id="saveAvatarBtn" class="btn-primary" style="margin-top: 15px; width: 100%;">Save Changes</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const listId = params.get('id');
        let allItems = [], listRankingType = 'numbers', isFreeOrder = false;
        let currentUserData = null, loggedInUser = null, currentListData = null;
        let visibleNotifsLimit = 5, currentNotifsData = [], visibleCommentsLimit = 10;
        let isReg = false; // הגדרת משתנה ההרשמה

        document.getElementById('themeToggle').onclick = () => document.body.classList.toggle('light-theme');

        function getRatingDisplay(rating, type) {
            if (rating === 0) return 'No Grade';
            if (type !== 'letters') return rating + '/10';
            const tiers = { 13: 'SSS', 12: 'SS', 11: 'S', 10: 'A', 9: 'B', 8: 'C', 7: 'D', 6: 'E' };
            return tiers[rating] || 'F';
        }

        async function fetchNotifications() {
            if (!loggedInUser) return;
            try {
                const res = await fetch('/api/notifications');
                if (res.ok) { currentNotifsData = await res.json(); renderNotifDropdownUI(); }
            } catch (e) { }
        }

       function renderNotifDropdownUI() {
            const dropdown = document.getElementById('notifDropdown');
            const badge = document.getElementById('notifBadge');
            if (!dropdown) return;

            // מונה התראות שלא נקראו
            const unreadCount = currentNotifsData.filter(n => !n.read).length;
            if (badge) {
                badge.textContent = unreadCount;
                unreadCount > 0 ? badge.classList.remove('hidden') : badge.classList.add('hidden');
            }

            dropdown.innerHTML = '';

            if (currentNotifsData.length === 0) {
                dropdown.innerHTML = '<div style="padding:15px; text-align:center; color:#888;">No notifications</div>';
                return;
            }

            // מיפוי ההודעות לפי סוג ההתראה (מה שהיה בשלב 3 א)
            const msgMap = {
                'like': `liked your list`,
                'comment': `commented on your list`,
                'follow': `started following you`,
                'reply': `replied to your comment`,
                'comment_like': `liked your comment`
            };

            // חיתוך המערך לפי המגבלה (5, 10 וכו')
            const notifsToShow = currentNotifsData.slice(0, visibleNotifsLimit);

            notifsToShow.forEach(n => {
                const div = document.createElement('div');
                // עיצוב הפריט (רקע שונה אם לא נקרא)
                div.style = `padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.85rem; cursor: pointer; background: ${n.read ? 'transparent' : 'rgba(187, 134, 252, 0.08)'}`;

                // יצירת תוכן ההודעה בעזרת המפה
                const actionText = msgMap[n.type] || 'interacted with you';
                const listNameText = n.listName ? `: <b>${n.listName}</b>` : '';

                div.innerHTML = `
            <div><b>${n.fromUser}</b> ${actionText}${listNameText}</div>
            <div style="font-size:0.7rem; color:#666; margin-top:4px;">${new Date(n.timestamp).toLocaleString('he-IL')}</div>
        `;

                // לחיצה על התראה תוביל לרשימה (אם יש כזו)
                div.onclick = () => {
                    if (n.listId) window.location.href = `/share.html?id=${n.listId}`;
                };
                dropdown.appendChild(div);
            });

            // כפתור "Show more"
            if (currentNotifsData.length > visibleNotifsLimit) {
                const loadMoreDiv = document.createElement('div');
                loadMoreDiv.style = "padding: 10px; text-align: center; color: var(--accent); cursor: pointer; font-size: 0.85rem; font-weight: bold; border-top: 1px solid var(--border);";
                loadMoreDiv.innerHTML = 'Show more...';
                loadMoreDiv.onclick = (e) => {
                    e.stopPropagation();
                    visibleNotifsLimit += 5;
                    renderNotifDropdownUI();
                };
                dropdown.appendChild(loadMoreDiv);
            }
        }

        async function initPage() {
                try {
                    console.log("Checking authentication and UI security...");

                    // 1. הגנה מיידית: נעלים הכל בצורה קשיחה (אונס תצוגה)
                    const sensitiveElements = ['notifArea', 'mobileProfileBtn', 'userDisplay', 'shareBtn', 'adminBtn'];
                    sensitiveElements.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) {
                            el.classList.add('hidden');
                            // הוספת setProperty כדי לנצח כל הגדרת flex ב-CSS
                            el.style.setProperty('display', 'none', 'important');
                        }
                    });

                    const authBtnNav = document.getElementById('authBtnNav');

                    // 2. בדיקה מול השרת
                    const authRes = await fetch('/api/auth/check').catch(() => null);

                    if (authRes && authRes.ok) {
                        currentUserData = await authRes.json();
                        loggedInUser = currentUserData.username;
                        console.log("Verified Member:", loggedInUser);

                        // עדכון פרטי מחובר
                        const usernameLabel = document.getElementById('usernameLabel');
                        if (usernameLabel) usernameLabel.textContent = loggedInUser;

                        const userDisplay = document.getElementById('userDisplay');
                        if (userDisplay) {
                            userDisplay.classList.remove('hidden');
                            userDisplay.style.setProperty('display', 'inline-flex', 'important');
                        }

                        if (authBtnNav) authBtnNav.textContent = "Logout";

                        // החזרת הכלים למשתמש מחובר (ביטול ההסתרה הכפויה משלב 1)
                        const toShow = ['notifArea', 'mobileProfileBtn', 'shareBtn'];
                        toShow.forEach(id => {
                            const el = document.getElementById(id);
                            if (el) {
                                el.classList.remove('hidden');
                                el.style.display = ''; // נותן ל-CSS (מובייל/דסקטופ) לקבוע את העיצוב שוב
                            }
                        });

                        // הרשאת אדמין
                        if (currentUserData.role === 'admin') {
                            const adminBtn = document.getElementById('adminBtn');
                            if (adminBtn) {
                                adminBtn.classList.remove('hidden');
                                adminBtn.style.display = '';
                            }
                        }

                        // טיפול באווטאר בנאב
                        const navAvatar = document.getElementById('navAvatar');
                        const navDefaultIcon = document.getElementById('navDefaultIcon');
                        if (navAvatar && currentUserData.avatar && currentUserData.avatar.trim() !== "") {
                            navAvatar.src = currentUserData.avatar;
                            navAvatar.classList.remove('hidden');
                            if (navDefaultIcon) navDefaultIcon.classList.add('hidden');
                        }

                        fetchNotifications();
                        setInterval(fetchNotifications, 30000);
                    } else {
                        console.log("Confirmed Guest: User buttons blocked.");
                        if (authBtnNav) authBtnNav.textContent = "Login";
                    }

                    // 3. טעינת תוכן הרשימה (עובד עבור כולם)
                    const listRes = await fetch(`/api/share/${listId}`);
                    const data = await listRes.json();

                    if (data.error) {
                        const titleEl = document.getElementById('listTitle');
                        if (titleEl) titleEl.textContent = "List Not Found";
                        return;
                    }

                    currentListData = data;
                    document.title = data.name;
                    document.getElementById('listTitle').textContent = data.name;
                    document.getElementById('listAuthor').textContent = `Created by: ${data.author}`;

                    listRankingType = data.rankingType || 'numbers';
                    isFreeOrder = data.isFreeOrder || false;
                    allItems = data.items || [];

                    renderList();

                    // לייקים
                    if (document.getElementById('likesCount')) {
                        document.getElementById('likesCount').textContent = (data.likes || []).length;
                    }

                    if (currentUserData && data.likes) {
                        const currentVisitorId = currentUserData._id.toString();
                        if (data.likes.map(id => id.toString()).includes(currentVisitorId)) {
                            const icon = document.querySelector('#likeBtn i');
                            if (icon) icon.className = 'fas fa-heart';
                        }
                    }

                    // תגובות
                    if (data.allowComments !== false) {
                        document.getElementById('commentsSection').style.display = 'block';
                        const inputArea = document.getElementById('commentInputArea');
                        const loginNotice = document.getElementById('loginToCommentNotice');

                        if (loggedInUser) {
                            if (inputArea) inputArea.style.display = 'flex';
                            if (loginNotice) loginNotice.style.display = 'none';
                        } else {
                            if (inputArea) inputArea.style.display = 'none';
                            if (loginNotice) loginNotice.style.display = 'block';
                        }
                        renderComments(data.comments, data.userId);
                    }

                    if (data.userId) fetchUserLists(data.userId, listId);

                } catch (e) {
                    console.error("Initialization Failed:", e);
                    const titleEl = document.getElementById('listTitle');
                    if (titleEl) titleEl.textContent = "Connection Timeout - Please Refresh";
                }
            }

        function renderList() {
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            const s = document.getElementById('listFilterInput').value.toLowerCase();
            const cat = document.getElementById('filterSelect').value;
            const filtered = allItems.filter(i => (cat === 'all' || i.sourceType === cat) && (i.characterName.toLowerCase().includes(s) || i.sourceTitle.toLowerCase().includes(s)));
            if (!isFreeOrder) filtered.sort((a, b) => b.rating - a.rating);
            filtered.forEach((item, index) => {
                const div = document.createElement('div'); div.className = 'char-card';
                const ratingHtml = item.rating === 0 ? '' : `<div class="char-rating">${getRatingDisplay(item.rating, listRankingType)}</div>`;
                div.innerHTML = `<div class="rank-badge ${index < 3 ? 'rank-' + (index + 1) : 'rank-other'}">#${index + 1}</div>${ratingHtml}<img src="${item.image}" class="char-img"><div class="char-info"><div class="char-name">${item.characterName}</div><div class="source-row"><span>${item.sourceTitle}</span><span class="red-type">${item.sourceType === 'TV Show' ? 'TV' : item.sourceType}</span></div></div>`;
                grid.appendChild(div);
            });
        }

      function renderComments(comments, ownerId) {
            const area = document.getElementById('commentsList');
            const loadMore = document.getElementById('loadMoreCommentsContainer');
            if (!area) return;
            area.innerHTML = '';

            // הגנה על המערך
            const safeComments = Array.isArray(comments) ? comments : [];

            if (safeComments.length === 0) {
                area.innerHTML = '<p style="text-align:center; color:#888; padding: 20px;">No comments yet. Be the first to reply!</p>';
                if (loadMore) loadMore.style.display = 'none';
                return;
            }

            // הגדרת נתוני משתמש נוכחי בצורה בטוחה (למניעת קריסת Loading לאורחים)
            const myId = currentUserData ? currentUserData._id.toString() : null;
            const isAdmin = currentUserData ? currentUserData.role === 'admin' : false;

            // הפיכת הסדר (חדשות למעלה) וחיתוך לפי כמות תצוגה
            const sorted = [...safeComments].reverse();
            const toDisplay = sorted.slice(0, visibleCommentsLimit);

            toDisplay.forEach(c => {
              const div = document.createElement('div');
              div.style = "padding:15px; background:var(--card-bg); border-radius:12px; border:1px solid var(--border); position:relative; margin-bottom:20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);";

              const adminTag = c.role === 'admin' ? '<span style="color:#FFD700; font-weight:bold; font-size:0.75rem; margin-left:5px;">(Admin)</span>' : '';

              // הגדרת משתמש נוכחי בצורה בטוחה (למניעת קריסת הדף לאורחים)
              const v_id = currentUserData ? currentUserData._id.toString() : null;
              const v_isAdmin = currentUserData ? currentUserData.role === 'admin' : false;

              // בדיקת לייק לתגובה ראשית
              const hasLikedC = c.likes && v_id && c.likes.map(id => id.toString()).includes(v_id);
              const cLikeColor = hasLikedC ? '#ff4444' : '#888';
              const cHeartClass = hasLikedC ? 'fas' : 'far';

              // בדיקת הרשאת מחיקה לתגובה ראשית
              let delBtnC = '';
              if (v_id && (v_isAdmin || v_id === ownerId.toString() || v_id === (c.userId || "").toString())) {
                  delBtnC = `<button onclick="deleteComment('${c._id}')" style="color:#ff4444; background:none; border:none; cursor:pointer;"><i class="fas fa-trash"></i></button>`;
              }

              // אוואטר ראשי (42px + טבעת סגולה)
              const avatarHtml = (c.avatar && c.avatar.trim() !== "") ?
                  `<img src="${c.avatar}" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); padding: 2px; margin-right: 12px; background: var(--bg-color); flex-shrink: 0;">` :
                  `<i class="fas fa-user-circle" style="font-size: 38px; margin-right: 12px; color: var(--text-muted); flex-shrink: 0;"></i>`;

              div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
                    <div style="display:flex; align-items:center; cursor:pointer;" onclick="showUserLists('${c.userId}', '${c.username}', '${c.avatar || ''}'); document.getElementById('communityModal').classList.remove('hidden');">
                        ${avatarHtml}
                        <b style="color:var(--accent); font-weight:bold; font-size: 1rem;">${c.username}${adminTag}</b>
                    </div>
                    <div style="display:flex; gap:12px; align-items:center;">
                        <button onclick="likeComment('${c._id}')" style="background:none; border:none; color:${cLikeColor}; cursor:pointer; font-size:0.95rem;">
                            <i class="${cHeartClass} fa-heart"></i> ${c.likes?.length || 0}
                        </button>
                        <button onclick="toggleReplyBox('${c._id}', '${c.username}')" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.95rem;">
                            <i class="fas fa-reply"></i>
                        </button>
                        ${delBtnC}
                    </div>
                </div>
                <div style="color:var(--text-main); margin-bottom:12px; line-height:1.5; padding-left: 54px;">${c.text}</div>
                
                <!-- שרשור תגובות (Replies) -->
                <div id="replies-${c._id}" style="margin-left: 54px; border-left: 2px solid var(--border); padding-left: 15px; margin-top: 10px;">
                    ${(c.replies || []).map(r => {
                  const hasLikedR = r.likes && v_id && r.likes.map(id => id.toString()).includes(v_id);
                  const rLikeColor = hasLikedR ? '#ff4444' : '#888';
                  const rHeartClass = hasLikedR ? 'fas' : 'far';
                  const rAdminTag = r.role === 'admin' ? '<span style="color:#FFD700; font-weight:bold; font-size:0.75rem; margin-left:5px;">(Admin)</span>' : '';

                  // אוואטר ריפליי (32px + טבעת סגולה)
                  const rAvatar = (r.avatar && r.avatar.trim() !== "") ?
                      `<img src="${r.avatar}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); padding: 1px; margin-right: 10px; background: var(--bg-color); flex-shrink: 0;">` :
                      `<i class="fas fa-user-circle" style="font-size: 28px; margin-right: 10px; color: var(--text-muted); flex-shrink: 0;"></i>`;

                  let delBtnR = '';
                  if (v_id && (v_isAdmin || v_id === ownerId.toString() || v_id === (r.userId || "").toString())) {
                      delBtnR = `<button onclick="deleteReply('${c._id}', '${r._id}')" style="color:#ff4444; background:none; border:none; cursor:pointer; font-size:0.75rem;"><i class="fas fa-trash"></i></button>`;
                  }

                  return `
                        <div style="margin-bottom:15px; font-size:0.9rem; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <div style="display:flex; align-items:center;">
                                    ${rAvatar}
                                    <b style="color:var(--accent); cursor:pointer;" onclick="showUserLists('${r.userId}', '${r.username}', '${r.avatar || ''}'); document.getElementById('communityModal').classList.remove('hidden');">${r.username}${rAdminTag}</b>
                                    ${r.replyingTo ? `<span style="color:var(--text-muted); font-size:0.75rem; margin-left:8px;">replying to @${r.replyingTo}</span>` : ''}
                                </div>
                                ${delBtnR}
                            </div>
                            <p style="margin:5px 0; color:var(--text-main); padding-left: 42px;">${r.text}</p>
                            <div style="display:flex; gap:15px; margin-left: 42px; margin-top: 5px;">
                                 <button onclick="likeReply('${c._id}', '${r._id}')" style="background:none; border:none; color:${rLikeColor}; cursor:pointer; font-size:0.75rem;">
                                    <i class="${rHeartClass} fa-heart"></i> ${r.likes?.length || 0}
                                 </button>
                                 <button onclick="toggleReplyBox('${c._id}', '${r.username}')" style="background:none; border:none; color:var(--accent); font-size:0.75rem; cursor:pointer;">Reply</button>
                            </div>
                        </div>`;
              }).join('')}
                </div>

                <!-- תיבת כתיבה לריפליי (רק למחוברים) -->
                <div id="reply-box-${c._id}" class="hidden" style="margin-top:15px; margin-left:54px; display:flex; gap:10px;">
                    <input type="text" id="reply-input-${c._id}" placeholder="Reply..." style="flex:1; background:var(--bg-color); border:1px solid var(--border); color:white; padding:10px; border-radius:8px; font-size:0.9rem;">
                    <button onclick="sendReply('${c._id}')" class="btn-primary" style="width:auto; padding:0 20px; font-size:0.85rem; height:42px;">Post</button>
                </div>
            `;
              area.appendChild(div);
          });

            if (loadMore) {
                loadMore.style.display = sorted.length > visibleCommentsLimit ? 'block' : 'none';
            }
        }

        document.getElementById('listFilterInput').oninput = renderList;
        document.getElementById('filterSelect').onchange = renderList;

        document.getElementById('likeBtn').onclick = async () => {
                // בודקים אם יש משתמש מחובר (שימוש במשתנה המדויק שלך)
                if (!loggedInUser) return alert("Please Login to like.");

                try {
                    // שים לב: משתמשים ב-listId כפי שהגדרת בראש הקובץ
                    const res = await fetch(`/api/lists/${listId}/like`, { method: 'POST' });
                    const result = await res.json();

                    // עדכון המספר על המסך
                    const likesCountEl = document.getElementById('likesCount');
                    if (likesCountEl) likesCountEl.textContent = result.likesCount;

                    // שינוי צבע הלב
                    const icon = document.querySelector('#likeBtn i');
                    if (icon) {
                        icon.className = result.isLiked ? 'fas fa-heart' : 'far fa-heart';
                    }

                    // עדכון הזיכרון המקומי למקרה של רינדור חוזר
                    if (currentListData) {
                        if (result.isLiked) {
                            if (!currentListData.likes) currentListData.likes = [];
                            currentListData.likes.push(currentUserData._id);
                        } else {
                            currentListData.likes = currentListData.likes.filter(uid => uid !== currentUserData._id);
                        }
                    }

                } catch (err) {
                    console.error("Like Action Error:", err);
                }
            };

        document.getElementById('submitComment').onclick = async () => {
                const inp = document.getElementById('commentText');
                const text = inp.value.trim();

                if (!loggedInUser) return alert("Please log in to comment.");
                if (!text) return;

                try {
                    const res = await fetch(`/api/lists/${listId}/comment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });

                    const data = await res.json();

                    // אם השרת החזיר שגיאה (כמו "חכה 10 דקות")
                    if (!res.ok) {
                        alert(data.error || "Failed to post comment.");
                        return; // מפסיקים כאן!
                    }

                    // הצלחה
                    inp.value = '';
                    currentListData.comments = data; // השרת מחזיר את כל המערך המעודכן
                    renderComments(currentListData.comments, currentListData.userId);

                } catch (e) {
                    console.error(e);
                    alert("An unexpected error occurred.");
                }
            };

        document.getElementById('loadMoreCommentsBtn').onclick = () => { visibleCommentsLimit += 10; renderComments(currentListData.comments, currentListData.userId); };

        window.deleteComment = async (cid) => {
            if (confirm("Delete?") && await fetch(`/api/lists/${listId}/comments/${cid}`, { method: 'DELETE' })) {
                currentListData.comments = currentListData.comments.filter(c => c._id !== cid); renderComments(currentListData.comments, currentListData.userId);
            }
        };

        async function handleAuthAction() {
            const u = document.getElementById('authUsername').value, p = document.getElementById('authPassword').value;
            if (!u || !p) return;
            const url = isReg ? '/api/auth/register' : '/api/auth/login';
            try {
                const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
                if (res.ok) window.location.reload(); else alert((await res.json()).error);
            } catch (e) { console.error(e); }
        }

        document.getElementById('authBtnNav').onclick = async () => {
            if (loggedInUser) { await fetch('/api/auth/logout', { method: 'POST' }); window.location.reload(); }
            else { document.getElementById('authModal').classList.remove('hidden'); }
        };
        document.getElementById('authSwitch').onclick = () => {
            isReg = !isReg;
            document.getElementById('authTitle').innerText = isReg ? "Register" : "Login";
            document.getElementById('authSubmitBtn').innerText = isReg ? "Register" : "Login";
        };
        document.getElementById('authSubmitBtn').onclick = (e) => { e.preventDefault(); handleAuthAction(); };
        document.getElementById('closeAuth').onclick = () => document.getElementById('authModal').classList.add('hidden');

        const authInputs = [document.getElementById('authUsername'), document.getElementById('authPassword')];
        authInputs.forEach(input => {
            input?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); handleAuthAction(); }
            });
        });

        document.getElementById('togglePassword').onclick = function () {
            const inp = document.getElementById('authPassword');
            const type = inp.getAttribute('type') === 'password' ? 'text' : 'password';
            inp.setAttribute('type', type);
            this.classList.toggle('fa-eye'); this.classList.toggle('fa-eye-slash');
        };

        document.getElementById('notifBtn').onclick = (e) => {
            e.stopPropagation(); const drop = document.getElementById('notifDropdown');
            if (drop.classList.contains('hidden')) {
                visibleNotifsLimit = 5; renderNotifDropdownUI(); drop.classList.remove('hidden');
                fetch('/api/notifications/read', { method: 'POST' });
            } else drop.classList.add('hidden');
        };

        document.getElementById('communityBtn').onclick = () => { document.getElementById('communityModal').classList.remove('hidden'); loadCommunityUsers(); };

        document.getElementById('commBackBtn').onclick = loadCommunityUsers;

        document.getElementById('closeCommModal').onclick = () => document.getElementById('communityModal').classList.add('hidden');

        async function loadCommunityUsers() {
                const modal = document.getElementById('communityModal');
                const grid = document.getElementById('communityGrid');
                const backBtn = document.getElementById('commBackBtn');
                const title = document.getElementById('communityTitle');

                modal.classList.remove('hidden');
                if (backBtn) backBtn.classList.add('hidden');
                title.textContent = "Community";

                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Loading...</p>';

                try {
                    const query = document.getElementById('userSearchInput')?.value || '';
                    const res = await fetch(`/api/users?search=${query}&t=${Date.now()}`);
                    const users = await res.json();
                    grid.innerHTML = '';

                    users.forEach(u => {
                        const div = document.createElement('div');
                        div.className = 'user-card';

                        const userImg = (u.avatar && u.avatar.trim() !== "") ?
                            `<img src="${u.avatar}" style="width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); margin-bottom: 10px;">` :
                            `<i class="fas fa-user-circle user-icon" style="font-size: 55px; margin-bottom: 10px;"></i>`;

                        let star = loggedInUser ? `
                <button class="follow-btn" onclick="toggleFollow(event, '${u._id}')">
                    <i class="${u.isFollowing ? 'fas fa-star active' : 'far fa-star'}"></i>
                </button>` : '';

                        div.innerHTML = `
                ${star}
                ${userImg}
                <div style="font-weight:bold;">${u.username}</div>
            `;

                        // התיקון כאן: הוספת u.avatar כפרמטר שלישי
                      div.onclick = (e) => {
                            if (!e.target.closest('.follow-btn')) {
                                // שולחים את האוואטר כפרמטר בצורה בטוחה
                                showUserLists(u._id, u.username, u.avatar);
                            }
                        };
                        grid.appendChild(div);
                    });
                } catch (e) { grid.innerHTML = 'Error.'; }
            }

        window.toggleFollow = async (e, uid) => { e.stopPropagation(); await fetch(`/api/users/follow/${uid}`, { method: 'POST' }); loadCommunityUsers(); };

      async function showUserLists(userId, username, avatar) {
            const grid = document.getElementById('communityGrid');
            const controls = document.getElementById('commControls');
            const backBtn = document.getElementById('commBackBtn');
            const title = document.getElementById('communityTitle');

            if (controls) controls.classList.add('hidden');
            if (backBtn) backBtn.classList.remove('hidden');

            grid.innerHTML = '<p style="text-align:center; padding: 20px;">Loading lists...</p>';

            // --- לוגיקת האווטאר המוגדל ---
            let displayAvatar = avatar;
            // אם לחצנו על עצמנו ואין פרמטר תמונה, ניקח מהנאב-בר
            if ((!displayAvatar || displayAvatar === "") && typeof state !== 'undefined' && state.userId === userId) {
                displayAvatar = document.getElementById('navAvatar')?.src;
            }

            // הגדרת ה-HTML לתמונה (גדלה ל-130px)
             const isImage = displayAvatar && (displayAvatar.startsWith('http') || displayAvatar.startsWith('data:image'));

          const headerAvatarHtml = isImage ?
              `<img src="${displayAvatar}" style="width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent); margin-bottom: 15px; display: block; background: var(--bg-color); padding: 3px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">` :
              `<i class="fas fa-user-circle" style="font-size: 130px; margin-bottom: 15px; color: var(--text-muted); display: block;"></i>`;

            // עדכון הכותרת
            title.innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin-bottom: 20px;">
            ${headerAvatarHtml}
            <div style="font-size: 1.6rem; font-weight: bold; color: var(--text-main);">${username}'s Lists</div>
        </div>
    `;

            try {
                const res = await fetch(`/api/users/${userId}/lists`);
                const lists = await res.json();
                grid.innerHTML = '';

                if (!lists || lists.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 20px; color: var(--text-muted);">This user has no public lists.</p>';
                    return;
                }

                lists.forEach(list => {
                    const div = document.createElement('div');
                    div.className = 'comm-list-card';
                    div.innerHTML = `
                <h4 style="color:var(--accent); margin-bottom: 5px; font-size: 1.1rem;">${list.name}</h4>
                <p style="color:var(--text-muted); font-size: 0.9rem;">${list.items ? list.items.length : 0} items</p>
            `;
                    div.onclick = () => window.open(`/share.html?id=${list._id}`, '_blank');
                    grid.appendChild(div);
                });
            } catch (e) {
                console.error(e);
                grid.innerHTML = '<p style="text-align:center;">Error loading lists.</p>';
            }
        }

        async function fetchUserLists(uid, curr) {
            const lists = await (await fetch(`/api/users/${uid}/lists`)).json();
            const drop = document.getElementById('userListsDropdown');
            if (lists.length > 1 && drop) {
                document.getElementById('otherListsContainer').style.display = 'flex';
                drop.innerHTML = lists.map(l => `<option value="${l._id}" ${l._id === curr ? 'selected' : ''}>${l.name}</option>`).join('');
                drop.onchange = (e) => window.location.href = `/share.html?id=${e.target.value}`;
            }
        }

        

        window.toggleReplyBox = function (cid, username) {
                const box = document.getElementById(`reply-box-${cid}`);
                const input = document.getElementById(`reply-input-${cid}`);
                if (!box || !input) return;

                box.classList.toggle('hidden');
                if (!box.classList.contains('hidden')) {
                    input.placeholder = `Replying to @${username}...`;
                    input.dataset.replyToUser = username; // זה מה ש-sendReply מחפש
                    input.focus();
                }
            };

            window.sendReply = async function (cid) {
                    const input = document.getElementById(`reply-input-${cid}`);
                    if (!input) return;

                    const text = input.value.trim();
                    const replyingTo = input.dataset.replyToUser; // נלקח מה-Toggle

                    if (!text) return;

                    try {
                        const res = await fetch(`/api/lists/${listId}/comments/${cid}/reply`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text, replyingTo })
                        });

                        const data = await res.json();

                        if (!res.ok) {
                            alert(data.error || "Error posting reply");
                            return;
                        }

                        // הצלחה - עדכון התצוגה
                        currentListData.comments = data;
                        renderComments(data, currentListData.userId);
                    } catch (e) {
                        console.error("Reply Error:", e);
                    }
                };

            window.likeComment = async function (commentId) {
                    if (!loggedInUser) return alert("Please Login to like.");
                    const res = await fetch(`/api/lists/${listId}/comments/${commentId}/like`, { method: 'POST' });
                    if (res.ok) {
                    
                        const updatedComments = await res.json();
                        currentListData.comments = updatedComments;
                        renderComments(updatedComments, currentListData.userId);
                    }
                };

            window.likeReply = async function (commentId, replyId) {
                    if (!loggedInUser) return alert("Please Login");
                    try {
                        const res = await fetch(`/api/lists/${listId}/comments/${commentId}/replies/${replyId}/like`, { method: 'POST' });
                        if (res.ok) {
                            // טעינה מחדש של המידע כדי שהלב ייצבע
                            currentListData.comments = await res.json();
                            renderComments(currentListData.comments, currentListData.userId);
                        }
                    } catch (err) { console.error(err); }
                };

                window.deleteReply = async function (commentId, replyId) {
                        if (!confirm("Delete this reply?")) return;
                        try {
                            const res = await fetch(`/api/lists/${listId}/comments/${commentId}/replies/${replyId}`, { method: 'DELETE' });
                            if (res.ok) {
                                const updatedComments = await res.json();
                                currentListData.comments = updatedComments;
                                renderComments(updatedComments, currentListData.userId);
                            }
                        } catch (err) { console.error(err); }
                    };

                    const DEFAULT_AVATAR = "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y";

                        window.openProfileModal = function () {
                            if (!loggedInUser) return;
                            const navAvatar = document.getElementById('navAvatar');
                            const previewImg = document.getElementById('profilePreviewImg');

                            if (navAvatar && navAvatar.src && !navAvatar.classList.contains('hidden')) {
                                previewImg.src = navAvatar.src;
                            } else {
                                previewImg.src = DEFAULT_AVATAR;
                            }
                            document.getElementById('avatarUrlInput').value = '';
                            document.getElementById('profileModal').classList.remove('hidden');
                        };

                        document.getElementById('closeProfileModal').onclick = () => document.getElementById('profileModal').classList.add('hidden');

                        document.getElementById('avatarUrlInput').addEventListener('input', (e) => {
                            document.getElementById('profilePreviewImg').src = e.target.value.trim() || DEFAULT_AVATAR;
                        });

                        document.getElementById('avatarFileInput').onchange = function (e) {
                            const file = e.target.files[0];
                            if (file) {
                                if (file.size > 1024 * 1024) return alert("File too large (Max 1MB)");
                                const reader = new FileReader();
                                reader.onload = (ev) => {
                                    document.getElementById('profilePreviewImg').src = ev.target.result;
                                    document.getElementById('avatarUrlInput').value = '';
                                };
                                reader.readAsDataURL(file);
                            }
                        };

                        document.getElementById('saveAvatarBtn').onclick = async () => {
                            const btn = document.getElementById('saveAvatarBtn');
                            const avatarData = document.getElementById('profilePreviewImg').src;
                            if (!avatarData || avatarData === DEFAULT_AVATAR) return alert("Choose a picture first");

                            btn.disabled = true; btn.textContent = "Saving...";

                            try {
                                const res = await fetch('/api/users/avatar', {
                                    method: 'PUT',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ avatar: avatarData })
                                });
                                if (res.ok) {
                                    alert("Profile Picture Updated!");
                                    window.location.reload();
                                } else alert("Update failed");
                            } catch (e) { alert("Server timeout, your image is being processed."); }
                            finally { btn.disabled = false; btn.textContent = "Save Changes"; }
                        };

        initPage();
    </script>
</body>

</html>
